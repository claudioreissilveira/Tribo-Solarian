<svg xmlns="http://www.w3.org/2000/svg" width="3320" height="1340" viewBox="0 0 3320 1340" role="img" aria-labelledby="title desc">
  <title id="title">MGPEB | Portas lógicas da autorização de pouso</title>
  <desc id="desc">Circuito com portas AND, OR e NOT que espelha avaliar_booleanos e decidir_pouso: cinco entradas formam AUTORIZAR, quatro formam ATENCAO e a etapa 2 gera uma única saída entre ALERTA, POUSO ADIADO, POUSO AUTORIZADO COM ATENÇÃO e POUSO AUTORIZADO.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.line{stroke:#526070;stroke-width:3;fill:none}.wire{stroke:#172033;stroke-width:3;fill:none}.dashwire{stroke:#526070;stroke-width:3;fill:none;stroke-dasharray:12 8}.node{fill:#fff;stroke:#526070;stroke-width:2}.process{fill:#f1f5f9}.variable{fill:#e8f3fb;stroke:#5b7890;stroke-width:2}.signal{fill:#fff;stroke:#5b7890;stroke-width:2}.compar{fill:#fff4cf;stroke:#9a7a2d;stroke-width:2}.decision-neutral{fill:#e8f3fb;stroke:#418ac0;stroke-width:2.5}.decision-critical{fill:#f9d9dc;stroke:#a95059;stroke-width:2.5}.decision-postpone{fill:#fde3c8;stroke:#b36b24;stroke-width:2.5}.decision-warning{fill:#fff0bf;stroke:#a8842e;stroke-width:2.5}.abort{fill:#dc493f;stroke:#9f2923;stroke-width:2}.postpone{fill:#f08a24;stroke:#a8560f;stroke-width:2}.warning{fill:#f4bf16;stroke:#9a7410;stroke-width:2}.safe{fill:#36c875;stroke:#187c46;stroke-width:2}.neutral{fill:#cfe3f3;stroke:#418ac0;stroke-width:2}.terminal{fill:#172033;stroke:#172033;stroke-width:2}.group{fill:#f3f8fc;stroke:#418ac0;stroke-width:2.5;stroke-dasharray:10 8}.opgroup{fill:#faf8fd;stroke:#7454b0;stroke-width:2.5;stroke-dasharray:10 8}.opnode{fill:#f4f0fb;stroke:#7454b0;stroke-width:2}.panel{fill:#fff;stroke:#526070;stroke-width:2}.gate{fill:#fff;stroke:#172033;stroke-width:3}.dot{fill:#172033}.cell{fill:#fff;stroke:#5b7890;stroke-width:2}.cellhead{fill:#dfe7ef;stroke:#5b7890;stroke-width:2}.rowgreen{fill:#d9f5e4}.rowyellow{fill:#fdf1c4}.rowred{fill:#f9d9dc}.roworange{fill:#fde3c8}.title{font:500 30px Arial,sans-serif;fill:#172033;text-anchor:middle}.label{font:500 22px Arial,sans-serif;fill:#172033;text-anchor:middle}.small{font:400 18px Arial,sans-serif;fill:#172033;text-anchor:middle}.tiny{font:400 16px Arial,sans-serif;fill:#172033;text-anchor:middle}.mono{font:600 20px Consolas,'Courier New',monospace;fill:#172033;text-anchor:middle}.monosmall{font:400 17px Consolas,'Courier New',monospace;fill:#172033;text-anchor:middle}.white{fill:#fff}.blue{fill:#287bb4}.purple{fill:#7454b0}.muted{fill:#526070}.start{text-anchor:start}.end{text-anchor:end}.bold{font-weight:700}.branch{font:500 18px Arial,sans-serif;fill:#39495a}.ov{text-decoration:overline}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#526070"/></marker>
  </defs>
  <rect class="bg" width="3320" height="1340"/>
  <text x="1300" y="52" class="title">MGPEB  |  Portas lógicas da autorização de pouso  (item 2)</text>
  <text x="1300" y="84" class="small">Equipe Tribo Solarian, missão Aurora Siger  |  espelha avaliar_booleanos e decidir_pouso</text>
  <rect x="30" y="130" width="1250" height="1010" rx="14" class="group"/>
  <text x="655" y="166" class="label blue">Etapa 1, regras de bloqueio e de atenção  (avaliar_booleanos)</text>
  <rect x="1300" y="130" width="1330" height="1010" rx="14" class="opgroup"/>
  <text x="1965" y="166" class="label purple">Etapa 2, uma única saída por módulo  (decidir_pouso)</text>
  <rect x="60" y="225" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="251.2" class="mono">combustivel_ok  (C)</text>
  <text x="250.0" y="274.6" class="tiny">combustível fora do VERMELHO</text>
  <rect x="60" y="300" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="326.2" class="mono">vento_ok  (V)</text>
  <text x="250.0" y="349.6" class="tiny">vento fora do VERMELHO</text>
  <rect x="60" y="375" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="401.2" class="mono">poeira_ok  (P)</text>
  <text x="250.0" y="424.6" class="tiny">poeira fora do VERMELHO</text>
  <rect x="60" y="450" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="476.2" class="mono">area_livre  (A)</text>
  <text x="250.0" y="499.6" class="tiny">área de pouso livre</text>
  <rect x="60" y="525" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="551.2" class="mono">erro_sensores  (S)</text>
  <text x="250.0" y="574.6" class="tiny">sensores em VERMELHO</text>
  <path d="M440 255L830 255" class="wire"/>
  <path d="M440 330L830 330" class="wire"/>
  <path d="M440 405L830 405" class="wire"/>
  <path d="M440 480L830 480" class="wire"/>
  <path d="M440 555L600 555" class="wire"/>
  <circle cx="490" cy="555" r="6" class="dot"/>
  <path d="M600 533.0L648 555L600 577.0Z" class="gate"/>
  <circle cx="655" cy="555" r="7" class="gate"/>
  <path d="M662 555L830 555" class="wire"/>
  <text x="735" y="543" class="tiny muted">NOT S</text>
  <path d="M830 225.0H925A180.0 180.0 0 0 1 925 585.0H830Z" class="gate"/>
  <text x="935" y="410" class="label">AND</text>
  <rect x="60" y="735" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="760.1" class="monosmall">amarelo_combustivel  (Yc)</text>
  <text x="250.0" y="782.5" class="tiny">combustível em AMARELO</text>
  <path d="M440 765L844.1 765" class="wire"/>
  <rect x="60" y="810" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="835.1" class="monosmall">amarelo_sensores  (Ys)</text>
  <text x="250.0" y="857.5" class="tiny">sensores em AMARELO</text>
  <path d="M440 840L864.9 840" class="wire"/>
  <rect x="60" y="885" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="910.1" class="monosmall">amarelo_vento  (Yv)</text>
  <text x="250.0" y="932.5" class="tiny">vento em AMARELO</text>
  <path d="M440 915L864.9 915" class="wire"/>
  <rect x="60" y="960" width="380" height="60" rx="8" class="signal"/>
  <text x="250.0" y="985.1" class="monosmall">amarelo_poeira  (Yp)</text>
  <text x="250.0" y="1007.5" class="tiny">poeira em AMARELO</text>
  <path d="M440 990L844.1 990" class="wire"/>
  <path d="M830 735.0Q905.0 877.5 830 1020.0Q985.0 1020.0 1080 877.5Q985.0 735.0 830 735.0Z" class="gate"/>
  <text x="940" y="885.5" class="label">OR</text>
  <path d="M490 555L490 650L1340 650L1340 260" class="wire"/>
  <text x="900" y="640" class="monosmall">erro_sensores (S)</text>
  <path d="M1105.0 405.0L1440 405.0L1440 950" class="wire"/>
  <text x="1180" y="391.0" class="mono">AUTORIZAR</text>
  <path d="M1080 877.5L1540 877.5" class="wire"/>
  <path d="M1540 800L1540 1020" class="wire"/>
  <circle cx="1540" cy="877.5" r="6" class="dot"/>
  <text x="1180" y="863.5" class="mono">ATENCAO</text>
  <path d="M1340 260L2120 260" class="wire"/>
  <rect x="2120" y="208.0" width="470" height="104" rx="8" class="abort"/>
  <text x="2355.0" y="243.8" class="label white">ALERTA</text>
  <text x="2355.0" y="269.9" class="small white">vai para a lista alerta</text>
  <text x="2355.0" y="293.7" class="monosmall white">ALERTA = S</text>
  <circle cx="1340" cy="480" r="6" class="dot"/>
  <path d="M1340 480L1650 480" class="wire"/>
  <path d="M1650 458.0L1698 480L1650 502.0Z" class="gate"/>
  <circle cx="1705" cy="480" r="7" class="gate"/>
  <path d="M1712 480L1830 480" class="wire"/>
  <circle cx="1440" cy="545" r="6" class="dot"/>
  <path d="M1440 545L1650 545" class="wire"/>
  <path d="M1650 523.0L1698 545L1650 567.0Z" class="gate"/>
  <circle cx="1705" cy="545" r="7" class="gate"/>
  <path d="M1712 545L1830 545" class="wire"/>
  <path d="M1830 452.5H1875A60.0 60.0 0 0 1 1875 572.5H1830Z" class="gate"/>
  <path d="M1935.0 512.5L2120 512.5" class="wire"/>
  <rect x="2120" y="460.5" width="470" height="104" rx="8" class="postpone"/>
  <text x="2355.0" y="496.3" class="label white">POUSO ADIADO</text>
  <text x="2355.0" y="522.4" class="small white">vai para a lista espera</text>
  <text x="2355.0" y="546.2" class="monosmall white">ADIADO = <tspan class="ov">S</tspan> · <tspan class="ov">AUTORIZAR</tspan></text>
  <circle cx="1440" cy="735" r="6" class="dot"/>
  <path d="M1440 735L1830 735" class="wire"/>
  <path d="M1540 800L1830 800" class="wire"/>
  <path d="M1830 707.5H1875A60.0 60.0 0 0 1 1875 827.5H1830Z" class="gate"/>
  <path d="M1935.0 767.5L2120 767.5" class="wire"/>
  <rect x="2120" y="715.5" width="470" height="104" rx="8" class="warning"/>
  <text x="2355.0" y="751.3" class="label">POUSO AUTORIZADO COM ATENÇÃO</text>
  <text x="2355.0" y="777.4" class="small">vai para pousados</text>
  <text x="2355.0" y="801.2" class="monosmall">COM_ATENCAO = AUTORIZAR · ATENCAO</text>
  <path d="M1440 950L1830 950" class="wire"/>
  <path d="M1540 1020L1650 1020" class="wire"/>
  <path d="M1650 998.0L1698 1020L1650 1042.0Z" class="gate"/>
  <circle cx="1705" cy="1020" r="7" class="gate"/>
  <path d="M1712 1020L1830 1020" class="wire"/>
  <path d="M1830 925.0H1875A60.0 60.0 0 0 1 1875 1045.0H1830Z" class="gate"/>
  <path d="M1935.0 985.0L2120 985.0" class="wire"/>
  <rect x="2120" y="933.0" width="470" height="104" rx="8" class="safe"/>
  <text x="2355.0" y="968.8" class="label">POUSO AUTORIZADO</text>
  <text x="2355.0" y="994.9" class="small">vai para pousados</text>
  <text x="2355.0" y="1018.7" class="monosmall">AUTORIZADO = AUTORIZAR · <tspan class="ov">ATENCAO</tspan></text>
  <rect x="2660" y="130" width="630" height="1010" rx="14" class="panel"/>
  <text x="2975" y="172" class="label">Expressões booleanas  (notação do Cap 2)</text>
  <text x="2690" y="225" class="label start">Etapa 1</text>
  <text x="2690" y="269" class="mono start">AUTORIZAR = C · V · P · A · <tspan class="ov">S</tspan></text>
  <text x="2690" y="313" class="mono start">ATENCAO = Yc + Ys + Yv + Yp</text>
  <text x="2690" y="373" class="label start">Etapa 2</text>
  <text x="2690" y="417" class="mono start">ALERTA = S</text>
  <text x="2690" y="461" class="mono start">ADIADO = <tspan class="ov">S</tspan> · <tspan class="ov">AUTORIZAR</tspan></text>
  <text x="2690" y="505" class="mono start">COM_ATENCAO = AUTORIZAR · ATENCAO</text>
  <text x="2690" y="549" class="mono start">AUTORIZADO = AUTORIZAR · <tspan class="ov">ATENCAO</tspan></text>
  <text x="2690" y="609" class="label start">Leitura</text>
  <text x="2690" y="653" class="small start">·  é AND,  +  é OR,  a barra em cima é NOT.</text>
  <text x="2690" y="687" class="small start">Só uma saída vale 1 por vez.</text>
  <text x="2690" y="721" class="small start">No código, a ordem do if, elif e else é:</text>
  <text x="2690" y="755" class="small start">ALERTA, ADIADO, COM ATENÇÃO, AUTORIZADO.</text>
  <text x="2690" y="805" class="label start">Exemplo, MED-01 no cenário moderado</text>
  <text x="2690" y="849" class="small start">C=1, V=1, P=1, A=1, S=0, então AUTORIZAR=1.</text>
  <text x="2690" y="883" class="small start">Vento e poeira em AMARELO, então ATENCAO=1.</text>
  <text x="2690" y="917" class="small start">Saída: POUSO AUTORIZADO COM ATENÇÃO.</text>
  <rect x="30" y="1170" width="3260" height="145" rx="14" class="panel"/>
  <text x="110" y="1210" class="label">Legenda</text>
  <path d="M80 1235.0H105A30.0 30.0 0 0 1 105 1295.0H80Z" class="gate"/>
  <text x="205" y="1272" class="small start">AND</text>
  <path d="M300 1235.0Q324.0 1265 300 1295.0Q349.6 1295.0 380 1265Q349.6 1235.0 300 1235.0Z" class="gate"/>
  <text x="400" y="1272" class="small start">OR</text>
  <path d="M480 1247.0L520 1265L480 1283.0Z" class="gate"/>
  <circle cx="527" cy="1265" r="7" class="gate"/>
  <text x="560" y="1272" class="small start">NOT</text>
  <path d="M660 1265L760 1265" class="wire"/>
  <path d="M710 1230L710 1300" class="wire"/>
  <circle cx="710" cy="1265" r="6" class="dot"/>
  <text x="780" y="1272" class="small start">ponto = ligação</text>
  <path d="M950 1265L1050 1265" class="wire"/>
  <path d="M1000 1230L1000 1300" class="wire"/>
  <text x="1070" y="1272" class="small start">cruzamento sem ponto = sem ligação</text>
  <rect x="1420" y="1242" width="150" height="46" rx="8" class="abort"/>
  <text x="1495.0" y="1271.5" class="small white">ALERTA</text>
  <rect x="1590" y="1242" width="190" height="46" rx="8" class="postpone"/>
  <text x="1685.0" y="1271.5" class="small white">POUSO ADIADO</text>
  <rect x="1800" y="1242" width="230" height="46" rx="8" class="warning"/>
  <text x="1915.0" y="1271.5" class="small">COM ATENÇÃO</text>
  <rect x="2050" y="1242" width="220" height="46" rx="8" class="safe"/>
  <text x="2160.0" y="1271.5" class="small">AUTORIZADO</text>
  <text x="2300" y="1258" class="small start">1 = verdadeiro, 0 = falso. O resultado sempre aparece</text>
  <text x="2300" y="1282" class="small start">escrito, nunca só pela cor.</text>
  <text x="1420" y="1215" class="small start">Os nomes das entradas e saídas são os mesmos do script TriboSolarian_MGPEB.py.</text>
</svg>
