<svg xmlns="http://www.w3.org/2000/svg" width="3500" height="1780" viewBox="0 0 3500 1780" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">SLR-33 | Verificação de Prontidão com Análise Assistida por IA</title>
  <desc id="desc">Fluxograma da Equipe Tribo Solarian, algoritmo de decisão por regras (item 1.2) com uma camada de análise assistida por IA em paralelo (item 1.5).</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.ink{fill:#172033}.line{stroke:#526070;stroke-width:3;fill:none}.node{fill:#fff;stroke:#526070;stroke-width:2}.process{fill:#f1f5f9}.variable{fill:#e8f3fb;stroke:#5b7890;stroke-width:2}.autonomy{fill:#fff4cf;stroke:#9a7a2d;stroke-width:2}.decision-critical{fill:#f9d9dc;stroke:#a95059;stroke-width:2.5}.decision-warning{fill:#fff0bf;stroke:#a8842e;stroke-width:2.5}.abort{fill:#dc493f;stroke:#9f2923;stroke-width:2}.warning{fill:#f4bf16;stroke:#9a7410;stroke-width:2}.safe{fill:#36c875;stroke:#187c46;stroke-width:2}.terminal{fill:#172033;stroke:#172033;stroke-width:2}.group{fill:#f3f8fc;stroke:#418ac0;stroke-width:2.5;stroke-dasharray:10 8}.ai{fill:#f4f0fb;stroke:#7454b0;stroke-width:2}.aigroup{fill:#faf8fd;stroke:#7454b0;stroke-width:2.5;stroke-dasharray:10 8}.label{font:500 22px Arial,sans-serif;fill:#172033;text-anchor:middle}.small{font:400 18px Arial,sans-serif;fill:#172033;text-anchor:middle}.tiny{font:400 16px Arial,sans-serif;fill:#172033;text-anchor:middle}.white{fill:#fff}.blue{fill:#287bb4}.purple{fill:#7454b0}.branch{font:500 18px Arial,sans-serif;fill:#39495a}.legend{font:400 16px Arial,sans-serif;fill:#172033;text-anchor:middle}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#526070"/></marker>
  </defs>
  <rect class="bg" width="3500" height="1780"/>
  <rect x="2420" y="440" width="1030" height="820" rx="14" class="aigroup"/>
  <text x="2935" y="475" class="label purple">Camada de IA, análise assistida  (item 1.5)</text>

  <text x="1200" y="48" class="label" style="font-size:30px">SLR-33  |  Verificação de Prontidão para Decolagem</text>
  <text x="1200" y="78" class="small">Equipe Tribo Solarian</text>

  <!-- Início e leitura -->
  <ellipse cx="1200" cy="140" rx="190" ry="48" class="terminal"/>
  <text x="1200" y="135" class="label white">INÍCIO</text><text x="1200" y="162" class="small white">Nova sequência de verificação</text>
  <path d="M1200 188V230" class="line" marker-end="url(#arrow)"/>
  <rect x="970" y="230" width="460" height="76" rx="8" class="node process"/>
  <text x="1200" y="261" class="label">Ler leitura atual de telemetria</text><text x="1200" y="288" class="small">(um valor para cada variável do item 1.1)</text>

  <!-- Ramificação de classificação e autonomia -->
  <path d="M1200 306V342H855V375" class="line" marker-end="url(#arrow)"/>
  <path d="M1200 342H2055V458" class="line" marker-end="url(#arrow)"/>
  <path d="M1200 342H2600V520" class="line" marker-end="url(#arrow)"/>
  <rect x="75" y="375" width="1650" height="420" rx="14" class="group"/>
  <text x="900" y="410" class="label blue">Classificação individual por variável  (item 1.1 + 1.2)</text>

  <rect x="105" y="438" width="370" height="142" rx="8" class="variable"/>
  <text x="290" y="470" class="label">Temperatura interna (°C)</text><text x="290" y="500" class="small">Verde 21 a 25</text><text x="290" y="528" class="small">Amarelo 18–21 / 25–27</text><text x="290" y="556" class="small">Vermelho &lt;18 ou &gt;27</text>
  <rect x="505" y="438" width="370" height="142" rx="8" class="variable"/>
  <text x="690" y="470" class="label">Temperatura externa (°C)</text><text x="690" y="500" class="small">Verde 5 a 35</text><text x="690" y="528" class="small">Amarelo -5–5 / 35–45</text><text x="690" y="556" class="small">Vermelho &lt;-5 ou &gt;45</text>
  <rect x="905" y="438" width="370" height="142" rx="8" class="variable"/>
  <text x="1090" y="470" class="label">Integridade estrutural</text><text x="1090" y="510" class="small">1 = íntegra</text><text x="1090" y="542" class="small">0 = comprometida</text>
  <rect x="1305" y="438" width="390" height="142" rx="8" class="variable"/>
  <text x="1500" y="470" class="label">Energia (%)</text><text x="1500" y="500" class="small">Verde 85 a 100</text><text x="1500" y="528" class="small">Amarelo 60–85</text><text x="1500" y="556" class="small">Vermelho &lt;60</text>

  <rect x="105" y="610" width="470" height="150" rx="8" class="variable"/>
  <text x="340" y="642" class="label">Pressão tanque hélio (psi)</text><text x="340" y="674" class="small">Verde 5500 a 6500</text><text x="340" y="704" class="small">Amarelo 4500–5500 / 6500–7000</text><text x="340" y="734" class="small">Vermelho &lt;4500 ou &gt;7000</text>
  <rect x="605" y="610" width="470" height="150" rx="8" class="variable"/>
  <text x="840" y="642" class="label">Pressão tanque propelente (psi)</text><text x="840" y="674" class="small">Verde 240 a 260</text><text x="840" y="704" class="small">Amarelo 220–240 / 260–280</text><text x="840" y="734" class="small">Vermelho &lt;220 ou &gt;280</text>
  <rect x="1105" y="610" width="590" height="150" rx="8" class="variable"/>
  <text x="1400" y="640" class="label">Status dos módulos críticos</text><text x="1400" y="673" class="small">5 módulos: propulsão, suporte à vida,</text><text x="1400" y="702" class="small">aviônica, comunicação, energia</text><text x="1400" y="735" class="small">OK / ALERTA / FALHA</text>

  <rect x="1810" y="458" width="490" height="150" rx="8" class="node autonomy"/>
  <text x="2055" y="495" class="label">Calcular autonomia energética  (item 1.4)</text><text x="2055" y="532" class="small">Energia líquida disponível vs.</text><text x="2055" y="565" class="small">consumo estimado da decolagem</text>

  <!-- Convergência -->
  <path d="M900 795V835H1200" class="line"/>
  <path d="M2055 608V835H1200" class="line"/>
  <path d="M1200 835V875" class="line" marker-end="url(#arrow)"/>
  <rect x="955" y="875" width="490" height="76" rx="8" class="node process"/>
  <text x="1200" y="908" class="label">Agregar todas as classificações</text><text x="1200" y="936" class="small">e o resultado da autonomia</text>
  <path d="M1200 951V990" class="line" marker-end="url(#arrow)"/>
  <path d="M1445 913H2200V840H2560" class="line" marker-end="url(#arrow)"/>

  <!-- Decisão crítica -->
  <path d="M1200 990L1490 1100L1200 1210L910 1100Z" class="decision-critical"/>
  <text x="1200" y="1049" class="small">Existe ao menos um item:</text><text x="1200" y="1080" class="label">VERMELHO, FALHA,</text><text x="1200" y="1111" class="label">integridade = 0, ou</text><text x="1200" y="1142" class="label">autonomia insuficiente?</text>

  <!-- Sim: aborta -->
  <path d="M1490 1100H1720V1170" class="line" marker-end="url(#arrow)"/><text x="1592" y="1088" class="branch">sim</text>
  <rect x="1530" y="1170" width="560" height="110" rx="8" class="abort"/>
  <text x="1810" y="1205" class="label white">DECOLAGEM ABORTADA</text><text x="1810" y="1236" class="small white">Registra no log qual(is) variável(is)</text><text x="1810" y="1265" class="small white">provocou(aram) o abort e seu valor</text>

  <!-- Não: segunda decisão -->
  <path d="M910 1100H650V1140" class="line" marker-end="url(#arrow)"/><text x="790" y="1088" class="branch">não</text>
  <path d="M650 1140L930 1240L650 1340L370 1240Z" class="decision-warning"/>
  <text x="650" y="1200" class="small">Existe ao menos um item</text><text x="650" y="1232" class="label">AMARELO ou ALERTA</text><text x="650" y="1265" class="small">(sem nenhum item crítico)?</text>

  <!-- Saídas de prontidão -->
  <path d="M510 1290V1380H365V1420" class="line" marker-end="url(#arrow)"/><text x="438" y="1368" class="branch">sim</text>
  <rect x="125" y="1420" width="480" height="90" rx="8" class="warning"/>
  <text x="365" y="1456" class="label">PRONTO PARA DECOLAR</text><text x="365" y="1486" class="small">(com alerta registrado no log)</text>
  <path d="M790 1290V1380H910V1420" class="line" marker-end="url(#arrow)"/><text x="840" y="1368" class="branch">não</text>
  <rect x="670" y="1420" width="480" height="90" rx="8" class="safe"/>
  <text x="910" y="1456" class="label">PRONTO PARA DECOLAR</text><text x="910" y="1486" class="small">(todas as variáveis nominais)</text>

  <!-- Log e fim -->
  <path d="M365 1510V1550H1200" class="line"/>
  <path d="M910 1510V1550H1200" class="line"/>
  <path d="M1810 1280V1550H1200" class="line"/>
  <path d="M1200 1550V1575" class="line" marker-end="url(#arrow)"/>
  <rect x="935" y="1575" width="530" height="88" rx="8" class="node process"/>
  <text x="1200" y="1606" class="label">Montar log de saída</text><text x="1200" y="1633" class="small">(leitura completa + classificação de</text><text x="1200" y="1657" class="small">cada variável + decisão final)</text>
  <path d="M1200 1663V1683" class="line" marker-end="url(#arrow)"/>
  <ellipse cx="1200" cy="1711" rx="190" ry="36" class="terminal"/>
  <text x="1200" y="1707" class="label white">FIM</text><text x="1200" y="1731" class="tiny white">Imprime o log de saída</text>

  <!-- Camada de IA (item 1.5) -->
  <rect x="2560" y="520" width="760" height="110" rx="8" class="ai"/>
  <text x="2940" y="558" class="label">Modelo 1 (ML)</text>
  <text x="2940" y="588" class="small">Classificação preditiva do estado da nave, a partir da mesma leitura</text>

  <rect x="2560" y="770" width="760" height="140" rx="8" class="ai"/>
  <text x="2940" y="808" class="label">Modelo 2 (ML)</text>
  <text x="2940" y="836" class="small">Aponta a causa provável de um alerta ou abort</text>
  <text x="2940" y="864" class="small">Treinado separadamente do Modelo 1</text>

  <rect x="2560" y="1060" width="760" height="140" rx="8" class="ai"/>
  <text x="2940" y="1098" class="label">Registro da análise de IA</text>
  <text x="2940" y="1126" class="small">Reúne a classificação do Modelo 1</text>
  <text x="2940" y="1154" class="small">e a causa do Modelo 2, quando houver</text>

  <path d="M2940 630V670H3400V1130H3320" class="line" marker-end="url(#arrow)"/>
  <path d="M2940 910V1060" class="line" marker-end="url(#arrow)"/>
  <path d="M2940 1200V1610H1465" class="line" marker-end="url(#arrow)"/>

  <!-- Legenda -->
  <rect x="2470" y="95" width="560" height="285" rx="10" class="node"/>
  <text x="2750" y="130" class="label">Legenda</text>
  <ellipse cx="2605" cy="180" rx="100" ry="30" class="terminal"/><text x="2605" y="186" class="legend white">Início / Fim</text>
  <rect x="2725" y="150" width="180" height="60" rx="6" class="node process"/><text x="2815" y="186" class="legend">Processo</text>
  <rect x="2545" y="255" width="180" height="60" rx="6" class="ai"/><text x="2635" y="291" class="legend">Modelo de IA</text>
  <path d="M2870 260L2960 225L3050 260L2960 295Z" class="decision-warning"/><text x="2960" y="266" class="legend">Decisão</text>
  <text x="2750" y="348" class="legend">Verde = seguro | Amarelo = atenção | Vermelho = crítico / aborta</text>
</svg>
