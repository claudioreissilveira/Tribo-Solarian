<svg xmlns="http://www.w3.org/2000/svg" width="3500" height="2760" viewBox="0 0 3500 2760" role="img" aria-labelledby="title desc">
  <title id="title">MGPEB | Rodada de autorização de pouso</title>
  <desc id="desc">Fluxograma da Equipe Tribo Solarian para uma rodada do MGPEB (executar_rodada): leitura, ordenação da fila, classificação, portas lógicas, decisão em quatro resultados e registro na pilha de eventos, com as ações do operador no menu em paralelo.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.line{stroke:#526070;stroke-width:3;fill:none}.wire{stroke:#172033;stroke-width:3;fill:none}.dashwire{stroke:#526070;stroke-width:3;fill:none;stroke-dasharray:12 8}.node{fill:#fff;stroke:#526070;stroke-width:2}.process{fill:#f1f5f9}.variable{fill:#e8f3fb;stroke:#5b7890;stroke-width:2}.signal{fill:#fff;stroke:#5b7890;stroke-width:2}.compar{fill:#fff4cf;stroke:#9a7a2d;stroke-width:2}.decision-neutral{fill:#e8f3fb;stroke:#418ac0;stroke-width:2.5}.decision-critical{fill:#f9d9dc;stroke:#a95059;stroke-width:2.5}.decision-postpone{fill:#fde3c8;stroke:#b36b24;stroke-width:2.5}.decision-warning{fill:#fff0bf;stroke:#a8842e;stroke-width:2.5}.abort{fill:#dc493f;stroke:#9f2923;stroke-width:2}.postpone{fill:#f08a24;stroke:#a8560f;stroke-width:2}.warning{fill:#f4bf16;stroke:#9a7410;stroke-width:2}.safe{fill:#36c875;stroke:#187c46;stroke-width:2}.neutral{fill:#cfe3f3;stroke:#418ac0;stroke-width:2}.terminal{fill:#172033;stroke:#172033;stroke-width:2}.group{fill:#f3f8fc;stroke:#418ac0;stroke-width:2.5;stroke-dasharray:10 8}.opgroup{fill:#faf8fd;stroke:#7454b0;stroke-width:2.5;stroke-dasharray:10 8}.opnode{fill:#f4f0fb;stroke:#7454b0;stroke-width:2}.panel{fill:#fff;stroke:#526070;stroke-width:2}.gate{fill:#fff;stroke:#172033;stroke-width:3}.dot{fill:#172033}.cell{fill:#fff;stroke:#5b7890;stroke-width:2}.cellhead{fill:#dfe7ef;stroke:#5b7890;stroke-width:2}.rowgreen{fill:#d9f5e4}.rowyellow{fill:#fdf1c4}.rowred{fill:#f9d9dc}.roworange{fill:#fde3c8}.title{font:500 30px Arial,sans-serif;fill:#172033;text-anchor:middle}.label{font:500 22px Arial,sans-serif;fill:#172033;text-anchor:middle}.small{font:400 18px Arial,sans-serif;fill:#172033;text-anchor:middle}.tiny{font:400 16px Arial,sans-serif;fill:#172033;text-anchor:middle}.mono{font:600 20px Consolas,'Courier New',monospace;fill:#172033;text-anchor:middle}.monosmall{font:400 17px Consolas,'Courier New',monospace;fill:#172033;text-anchor:middle}.white{fill:#fff}.blue{fill:#287bb4}.purple{fill:#7454b0}.muted{fill:#526070}.start{text-anchor:start}.end{text-anchor:end}.bold{font-weight:700}.branch{font:500 18px Arial,sans-serif;fill:#39495a}.ov{text-decoration:overline}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#526070"/></marker>
  </defs>
  <rect class="bg" width="3500" height="2760"/>
  <text x="1150" y="52" class="title">MGPEB  |  Rodada de Autorização de Pouso</text>
  <text x="1150" y="84" class="small">Equipe Tribo Solarian  |  itens 2 e 3</text>
  <ellipse cx="1150" cy="150" rx="240" ry="52" class="terminal"/>
  <text x="1150" y="145.5" class="label white">INÍCIO</text>
  <text x="1150" y="171.7" class="small white">Menu, opção 1: Próxima rodada</text>
  <path d="M1150 202V245" class="line" marker-end="url(#arrow)"/>
  <rect x="820" y="245" width="660" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="280.5" class="label">Operador informa a área de pouso</text>
  <text x="1150.0" y="306.7" class="small">pedir_area_livre: sim = livre, não = ocupada</text>
  <path d="M1150 325V365" class="line" marker-end="url(#arrow)"/>
  <rect x="820" y="365" width="660" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="400.5" class="label">Abrir nova rodada  (executar_rodada)</text>
  <text x="1150.0" y="426.7" class="small">rodada + 1 e area_ocupada = área não está livre</text>
  <path d="M1150 445V485" class="line" marker-end="url(#arrow)"/>
  <rect x="820" y="485" width="660" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="520.5" class="label">Ler as leituras simuladas</text>
  <text x="1150.0" y="546.7" class="small">vento e poeira do cenário; combustível e sensores de cada módulo</text>
  <path d="M1150 565V605" class="line" marker-end="url(#arrow)"/>
  <rect x="820" y="605" width="660" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="640.5" class="label">Devolver a lista espera para a fila_pouso</text>
  <text x="1150.0" y="666.7" class="small">cada retorno empilha o evento RETORNO À FILA</text>
  <path d="M1150 685V725" class="line" marker-end="url(#arrow)"/>
  <rect x="820" y="725" width="660" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="760.5" class="label">Ordenar a fila_pouso por inserção</text>
  <text x="1150.0" y="786.7" class="small">chave: prioridade (1 é a mais urgente) e horário de chegada</text>
  <path d="M1150 805V860" class="line" marker-end="url(#arrow)"/>
  <polygon points="1150,860.0 1420.0,960 1150,1060.0 880.0,960" class="decision-neutral"/>
  <text x="1150" y="952.7" class="label">Ainda há módulo</text>
  <text x="1150" y="983.1" class="label">na fila_pouso?</text>
  <path d="M1420 960H1650" class="line" marker-end="url(#arrow)"/>
  <text x="1450" y="948" class="branch">não</text>
  <rect x="1650" y="915" width="520" height="90" rx="8" class="node process"/>
  <text x="1910.0" y="955.5" class="label">Mostrar a rodada  (mostrar_rodada)</text>
  <text x="1910.0" y="981.7" class="small">decisões, motivos e modelos matemáticos</text>
  <path d="M1910 1005V1055" class="line" marker-end="url(#arrow)"/>
  <ellipse cx="1910" cy="1105" rx="200" ry="50" class="terminal"/>
  <text x="1910" y="1100.5" class="label white">FIM</text>
  <text x="1910" y="1126.7" class="small white">volta ao menu principal</text>
  <path d="M1150 1060V1110" class="line" marker-end="url(#arrow)"/>
  <text x="1164" y="1090" class="branch">sim</text>
  <rect x="820" y="1110" width="660" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="1146.2" class="label">Avaliar o primeiro módulo da fila</text>
  <text x="1150.0" y="1171.3" class="monosmall">ver_topo(fila_pouso) e autorizar_pouso(...)</text>
  <path d="M1150 1190V1235" class="line" marker-end="url(#arrow)"/>
  <rect x="80" y="1235" width="2160" height="290" rx="14" class="group"/>
  <text x="1150" y="1271" class="label blue">Classificação por variável  (item 2, funções classificar_*; ver MGPEB_classificacao)</text>
  <rect x="110" y="1297" width="400" height="200" rx="8" class="variable"/>
  <text x="310.0" y="1367.7" class="label">Combustível (%)</text>
  <text x="310.0" y="1393.8" class="small">Verde ≥ 40</text>
  <text x="310.0" y="1418.7" class="small">Amarelo ≥ 30 e &lt; 40</text>
  <text x="310.0" y="1443.5" class="small">Vermelho &lt; 30</text>
  <rect x="532" y="1297" width="400" height="200" rx="8" class="variable"/>
  <text x="732.0" y="1367.7" class="label">Sensores (%)</text>
  <text x="732.0" y="1393.8" class="small">Verde ≥ 90</text>
  <text x="732.0" y="1418.7" class="small">Amarelo ≥ 75 e &lt; 90</text>
  <text x="732.0" y="1443.5" class="small">Vermelho &lt; 75</text>
  <rect x="954" y="1297" width="400" height="200" rx="8" class="variable"/>
  <text x="1154.0" y="1367.7" class="label">Vento (m/s)</text>
  <text x="1154.0" y="1393.8" class="small">Verde ≤ 8</text>
  <text x="1154.0" y="1418.7" class="small">Amarelo &gt; 8 e ≤ 15</text>
  <text x="1154.0" y="1443.5" class="small">Vermelho &gt; 15</text>
  <rect x="1376" y="1297" width="400" height="200" rx="8" class="variable"/>
  <text x="1576.0" y="1367.7" class="label">Poeira (τ)</text>
  <text x="1576.0" y="1393.8" class="small">Verde ≤ 1</text>
  <text x="1576.0" y="1418.7" class="small">Amarelo &gt; 1 e ≤ 3</text>
  <text x="1576.0" y="1443.5" class="small">Vermelho &gt; 3</text>
  <rect x="1798" y="1297" width="400" height="200" rx="8" class="variable"/>
  <text x="1998.0" y="1367.7" class="label">Área de pouso</text>
  <text x="1998.0" y="1393.8" class="small">livre</text>
  <text x="1998.0" y="1418.7" class="small">sem faixa amarela</text>
  <text x="1998.0" y="1443.5" class="small">ocupada bloqueia</text>
  <path d="M1150 1525V1570" class="line" marker-end="url(#arrow)"/>
  <rect x="790" y="1570" width="720" height="80" rx="8" class="node process"/>
  <text x="1150.0" y="1605.5" class="label">Converter em booleanos e aplicar as portas lógicas</text>
  <text x="1150.0" y="1631.7" class="small">avaliar_booleanos: AUTORIZAR e ATENCAO (ver MGPEB_portas_logicas)</text>
  <path d="M1150 1650V1700" class="line" marker-end="url(#arrow)"/>
  <polygon points="1150,1700.0 1400.0,1790 1150,1880.0 900.0,1790" class="decision-critical"/>
  <text x="1150" y="1785.5" class="label">erro_sensores?</text>
  <text x="1150" y="1811.7" class="small">sensores em VERMELHO</text>
  <path d="M1400 1790H1700" class="line" marker-end="url(#arrow)"/>
  <text x="1430" y="1778" class="branch">sim</text>
  <rect x="1700" y="1745" width="470" height="90" rx="8" class="abort"/>
  <text x="1935.0" y="1785.5" class="label white">ALERTA</text>
  <text x="1935.0" y="1811.7" class="small white">módulo vai para a lista alerta</text>
  <path d="M1150 1880V1920" class="line" marker-end="url(#arrow)"/>
  <text x="1164" y="1912" class="branch">não</text>
  <polygon points="1150,1920.0 1400.0,2010 1150,2100.0 900.0,2010" class="decision-postpone"/>
  <text x="1150" y="2005.5" class="label">AUTORIZAR?</text>
  <text x="1150" y="2031.7" class="small">nada em VERMELHO e área livre</text>
  <path d="M1400 2010H1700" class="line" marker-end="url(#arrow)"/>
  <text x="1430" y="1998" class="branch">não</text>
  <rect x="1700" y="1965" width="470" height="90" rx="8" class="postpone"/>
  <text x="1935.0" y="2005.5" class="label white">POUSO ADIADO</text>
  <text x="1935.0" y="2031.7" class="small white">módulo vai para a lista espera</text>
  <path d="M1150 2100V2140" class="line" marker-end="url(#arrow)"/>
  <text x="1164" y="2132" class="branch">sim</text>
  <polygon points="1150,2140.0 1400.0,2230 1150,2320.0 900.0,2230" class="decision-warning"/>
  <text x="1150" y="2225.5" class="label">ATENCAO?</text>
  <text x="1150" y="2251.7" class="small">algum item em AMARELO</text>
  <path d="M900 2230H600V2360" class="line" marker-end="url(#arrow)"/>
  <text x="820" y="2218" class="branch">sim</text>
  <rect x="330" y="2360" width="540" height="96" rx="8" class="warning"/>
  <text x="600.0" y="2403.5" class="label">POUSO AUTORIZADO COM ATENÇÃO</text>
  <text x="600.0" y="2429.7" class="small">vai para pousados e a área fica ocupada</text>
  <path d="M1400 2230H1700V2360" class="line" marker-end="url(#arrow)"/>
  <text x="1450" y="2218" class="branch">não</text>
  <rect x="1430" y="2360" width="540" height="96" rx="8" class="safe"/>
  <text x="1700.0" y="2403.5" class="label">POUSO AUTORIZADO</text>
  <text x="1700.0" y="2429.7" class="small">vai para pousados e a área fica ocupada</text>
  <path d="M600 2456V2510H2280" class="line"/>
  <path d="M1700 2456V2510" class="line"/>
  <path d="M2170 1790H2280V2510" class="line"/>
  <path d="M2170 2010H2280" class="line"/>
  <path d="M1150 2510V2560" class="line" marker-end="url(#arrow)"/>
  <rect x="750" y="2560" width="800" height="90" rx="8" class="node process"/>
  <text x="1150.0" y="2600.5" class="label">Mover e registrar  (mover_modulo)</text>
  <text x="1150.0" y="2626.7" class="small">tira da fila_pouso, põe na lista de destino e empilha o evento no historico_eventos</text>
  <path d="M1150 2650V2700H50V960H880" class="line" marker-end="url(#arrow)"/>
  <text x="70" y="1700" class="branch start">próximo módulo</text>
  <rect x="1990" y="2590" width="820" height="120" rx="8" class="node"/>
  <text x="2400.0" y="2633.1" class="label">Um pouso por rodada</text>
  <text x="2400.0" y="2659.2" class="small">depois do primeiro pouso, area_ocupada = True,</text>
  <text x="2400.0" y="2684.1" class="small">então os outros módulos da rodada são adiados</text>
  <rect x="2440" y="250" width="1010" height="1130" rx="14" class="opgroup"/>
  <text x="2945.0" y="290" class="label purple">Ações do operador no menu  (opções 2 a 8)</text>
  <rect x="2480" y="330" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="377.1" class="label">2. Estado e histórico</text>
  <text x="2945.0" y="403.2" class="small">mostra fila_pouso, pousados, espera e alerta</text>
  <text x="2945.0" y="428.1" class="small">e o topo da pilha historico_eventos</text>
  <rect x="2480" y="478" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="525.1" class="label">3. Buscar módulo</text>
  <text x="2945.0" y="551.2" class="small">busca sequencial: menor combustível, maior prioridade</text>
  <text x="2945.0" y="576.1" class="small">e tipo de carga; busca binária: id</text>
  <rect x="2480" y="626" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="673.1" class="label">4. Comparar ordenações</text>
  <text x="2945.0" y="699.2" class="small">inserção e seleção sobre o cadastro,</text>
  <text x="2945.0" y="724.1" class="small">com a situação do combustível de cada módulo</text>
  <rect x="2480" y="774" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="833.5" class="label">5. Editar módulo ou cenário</text>
  <text x="2945.0" y="859.7" class="small">a fila_pouso é reordenada depois da edição</text>
  <rect x="2480" y="922" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="969.1" class="label">6. Desfazer ou liberar alerta</text>
  <text x="2945.0" y="995.2" class="small">desfazer: desempilha o último evento e devolve o módulo à fila</text>
  <text x="2945.0" y="1020.1" class="small">liberar: alerta para a fila, com confirmação do operador</text>
  <rect x="2480" y="1070" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="1117.1" class="label">7. Exemplos de execução</text>
  <text x="2945.0" y="1143.2" class="small">casos fixos no modo determinístico</text>
  <text x="2945.0" y="1168.1" class="small">para os prints da pasta testes</text>
  <rect x="2480" y="1218" width="930" height="128" rx="8" class="opnode"/>
  <text x="2945.0" y="1277.5" class="label">8. Sair</text>
  <text x="2945.0" y="1303.7" class="small">encerra a simulação</text>
  <rect x="2440" y="1430" width="1010" height="520" rx="14" class="panel"/>
  <text x="2945.0" y="1470" class="label">Legenda</text>
  <ellipse cx="2580" cy="1530" rx="90" ry="32" class="terminal"/>
  <text x="2580" y="1536" class="tiny white">Início / fim</text>
  <rect x="2730" y="1500" width="190" height="60" rx="8" class="node process"/>
  <text x="2825.0" y="1535.8" class="tiny">Processo</text>
  <rect x="2960" y="1500" width="190" height="60" rx="8" class="variable"/>
  <text x="3055.0" y="1535.8" class="tiny">Classificação</text>
  <polygon points="3300,1490.0 3400.0,1530 3300,1570.0 3200.0,1530" class="decision-neutral"/>
  <text x="3300" y="1535.8" class="tiny">Decisão</text>
  <rect x="2500" y="1600" width="420" height="60" rx="8" class="opnode"/>
  <text x="2710.0" y="1635.8" class="tiny">Ação do operador no menu</text>
  <rect x="2960" y="1600" width="420" height="60" rx="8" class="node"/>
  <text x="3170.0" y="1635.8" class="tiny">Observação</text>
  <rect x="2500" y="1690" width="300" height="44" rx="8" class="abort"/>
  <text x="2650.0" y="1718.5" class="small white">ALERTA</text>
  <text x="2830" y="1719" class="small start">sensores em VERMELHO</text>
  <rect x="2500" y="1746" width="300" height="44" rx="8" class="postpone"/>
  <text x="2650.0" y="1774.5" class="small white">POUSO ADIADO</text>
  <text x="2830" y="1775" class="small start">VERMELHO ou área ocupada</text>
  <rect x="2500" y="1802" width="300" height="44" rx="8" class="warning"/>
  <text x="2650.0" y="1830.5" class="small">COM ATENÇÃO</text>
  <text x="2830" y="1831" class="small start">algum item em AMARELO</text>
  <rect x="2500" y="1858" width="300" height="44" rx="8" class="safe"/>
  <text x="2650.0" y="1886.5" class="small">AUTORIZADO</text>
  <text x="2830" y="1887" class="small start">tudo em VERDE</text>
  <text x="2945.0" y="1928" class="tiny">O resultado sempre aparece escrito, nunca só pela cor.</text>
</svg>
