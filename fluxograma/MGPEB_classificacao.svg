  <text x="2130" y="496" class="label start">Como ler</text>
  <text x="2130" y="536" class="small start">Combustível e sensores: quanto menor, pior.</text>
  <text x="2130" y="567" class="small start">O comparador testa valor &lt; limite (classificar_minimo).</text>
  <text x="2130" y="598" class="small start">Vento e poeira: quanto maior, pior.</text>
  <text x="2130" y="629" class="small start">O comparador testa valor &gt; limite (classificar_maximo).</text>
  <text x="2130" y="674" class="label start">Por que dois comparadores</text>
  <text x="2130" y="714" class="small start">R = 1 já basta para VERMELHO.</text>
  <text x="2130" y="745" class="small start">AMARELO exige B = 1 e R = 0, por isso B · <tspan class="ov">R</tspan>.</text>
  <text x="2130" y="776" class="small start">VERDE é quando nem B dispara: <tspan class="ov">B</tspan>.</text>
  <text x="2130" y="807" class="small start">Só uma das três saídas vale 1 por vez.</text>
  <text x="2130" y="852" class="label start">Saídas que seguem para as portas</text>
  <text x="2130" y="892" class="small start">combustivel_ok, vento_ok e poeira_ok = NOT VERMELHO</text>
  <text x="2130" y="923" class="small start">erro_sensores = VERMELHO dos sensores</text>
  <text x="2130" y="954" class="small start">amarelo_* = AMARELO de cada variável</text>
  <text x="2130" y="985" class="small start">area_livre = NOT area_ocupada</text>
  <text x="2130" y="1016" class="small start muted">Ver MGPEB_portas_logicas.svg</text>
  <text x="1500" y="1430" class="small">Os limiares são valores de projeto descritos no material de apoio (seções 2.3 a 2.6). A classificação sempre aparece escrita, nunca só pela cor.</text>
</svg>
