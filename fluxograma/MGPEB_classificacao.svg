<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1480" viewBox="0 0 3000 1480" role="img" aria-labelledby="title desc">
  <title id="title">MGPEB | Classificação das leituras por comparadores</title>
  <desc id="desc">Cada leitura passa por dois comparadores de limiar. Portas NOT e AND transformam os comparadores em VERDE, AMARELO e VERMELHO, e daí saem os booleanos usados nas portas lógicas.</desc>
